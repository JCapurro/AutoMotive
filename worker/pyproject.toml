[project]
name = "automotive-worker"
version = "0.1.0"
description = "AutoMotive worker: collectors, pipeline and Telegram bot"
requires-python = ">=3.12"
# Dependencies: requirements.txt (pip install -r worker/requirements.txt).

[tool.pytest.ini_options]
# worker/ is the import root: `import db`, `from collectors import REGISTRY`.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a Postgres with the supabase/ migrations applied (TEST_DATABASE_URL)",
]
